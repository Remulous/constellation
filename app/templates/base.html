<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>{% block title %}Constellation{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" id="app-sidebar">
    <a class="brand-lockup" href="/" aria-label="Constellation dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg class="icon icon-xl"><use href="/static/icons.svg#constellation"></use></svg>
      </span>
      <span><strong>Constellation</strong><small>Private relationship CRM</small></span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <p class="nav-label">Workspace</p>
      <a class="nav-item {{ 'active' if request.url.path == '/today' }}" href="/today" {{ 'aria-current="page"' if request.url.path == '/today' }}>
        <svg class="icon"><use href="/static/icons.svg#calendar"></use></svg><span>Today</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path == '/' }}" href="/" {{ 'aria-current="page"' if request.url.path == '/' }}>
        <svg class="icon"><use href="/static/icons.svg#dashboard"></use></svg><span>Dashboard</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/people') }}" href="/people" {{ 'aria-current="page"' if request.url.path.startswith('/people') }}>
        <svg class="icon"><use href="/static/icons.svg#people"></use></svg><span>People</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/follow-ups') }}" href="/follow-ups" {{ 'aria-current="page"' if request.url.path.startswith('/follow-ups') }}>
        <svg class="icon"><use href="/static/icons.svg#calendar"></use></svg><span>Follow-ups</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/segments') }}" href="/segments" {{ 'aria-current="page"' if request.url.path.startswith('/segments') }}>
        <svg class="icon"><use href="/static/icons.svg#tag"></use></svg><span>Saved segments</span>
      </a>

      <p class="nav-label">Data</p>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/imports') }}" href="/imports" {{ 'aria-current="page"' if request.url.path.startswith('/imports') }}>
        <svg class="icon"><use href="/static/icons.svg#upload"></use></svg><span>Imports</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/vetbiz-imports') }}" href="/vetbiz-imports" {{ 'aria-current="page"' if request.url.path.startswith('/vetbiz-imports') }}>
        <svg class="icon"><use href="/static/icons.svg#upload"></use></svg><span>VetBiz minutes</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/merge-review') }}" href="/merge-review" {{ 'aria-current="page"' if request.url.path.startswith('/merge-review') }}>
        <svg class="icon"><use href="/static/icons.svg#merge"></use></svg><span>Merge review</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/tags') }}" href="/tags" {{ 'aria-current="page"' if request.url.path.startswith('/tags') }}>
        <svg class="icon"><use href="/static/icons.svg#tag"></use></svg><span>Tags</span>
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/data-quality') }}" href="/data-quality" {{ 'aria-current="page"' if request.url.path.startswith('/data-quality') }}>
        <svg class="icon"><use href="/static/icons.svg#shield"></use></svg><span>Data quality</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-item {{ 'active' if request.url.path.startswith('/settings') }}" href="/settings" {{ 'aria-current="page"' if request.url.path.startswith('/settings') }}>
        <svg class="icon"><use href="/static/icons.svg#settings"></use></svg><span>Settings</span>
      </a>
      <a class="nav-item" href="/export.csv">
        <svg class="icon"><use href="/static/icons.svg#download"></use></svg><span>Export CSV</span>
      </a>
      <a class="nav-item" href="/export/google.csv">
        <svg class="icon"><use href="/static/icons.svg#download"></use></svg><span>Google Contacts</span>
      </a>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="nav-item nav-button" type="submit">
          <svg class="icon"><use href="/static/icons.svg#logout"></use></svg><span>Log out</span>
        </button>
      </form>
      <div class="privacy-note">
        <svg class="icon"><use href="/static/icons.svg#shield"></use></svg>
        <span>Local, private, and yours</span>
      </div>
    </div>
  </aside>

  <div class="sidebar-scrim" data-sidebar-close aria-hidden="true"></div>

  <div class="workspace">
    <header class="mobile-header">
      <a class="mobile-brand" href="/">
        <svg class="icon icon-lg"><use href="/static/icons.svg#constellation"></use></svg>
        <span>Constellation</span>
      </a>
      <button class="icon-button" type="button" data-sidebar-toggle aria-controls="app-sidebar" aria-expanded="false" aria-label="Open navigation">
        <svg class="icon"><use href="/static/icons.svg#menu"></use></svg>
      </button>
    </header>
    <main id="main-content">{% block content %}{% endblock %}</main>
  </div>
</div>
</body>
</html>
