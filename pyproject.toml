[project]
name = "constellation"
version = "0.1.0"
description = "Private, self-hosted personal relationship manager"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "fastapi==0.116.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "mcp==1.28.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
